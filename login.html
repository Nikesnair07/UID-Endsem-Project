<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — ReadySetCook</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursor-ring"></div>

<div class="login-wrap">
  <div class="login-bg"></div>
  <div class="particles" id="particles"></div>

  <div class="login-card">
    <div class="login-logo">
      <a href="index.html" class="logo">🍳 ReadySetCook</a>
    </div>
    <h2>Welcome Back</h2>
    <p>Sign in to access your AI kitchen assistant</p>

    <div class="field">
      <label>Email Address</label>
      <input type="email" id="emailInput" placeholder="you@example.com" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="passInput" placeholder="••••••••" />
    </div>

    <button class="login-btn" onclick="doLogin()">Sign In →</button>

    <div class="login-hint">
      Don't have an account? <a href="login.html" style="color:var(--orange)">It's free</a> — any credentials work!
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
function doLogin() {
  const btn = document.querySelector('.login-btn');
  btn.textContent = 'Signing in...';
  btn.disabled = true;
  setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);
}
document.getElementById('passInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
